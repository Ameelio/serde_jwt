name: Unit Tests

on:
  push:
    branches:
      - "main"
      - "release/**"
  pull_request:
    branches: 
      - "main"
      - "release/**"

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Unit Tests
        run: cargo test
