[package]
name = "serde_jwt"
version = "0.1.0"
edition = "2024"

[features]
debug = [
  "dep:tracing"
]

[dependencies]

base64ct = { version = "1.8.0", features = ["std"] }
chrono = { version = "0.4.42", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"]}
serde_json = "1.0.142"
tracing = { version = "0.1.44", optional = true }

[dev-dependencies]
hmac = "0.12.1"
serde_test = "1.0.177"
sha2 = "0.10.9"

